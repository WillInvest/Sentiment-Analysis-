seed: 42

models:
  bert:
    hf_id: "bert-base-uncased"
    revision: "main"
    roles: ["finetune_encoder"]
    embedding_dim: 768
  finbert:
    hf_id: "ProsusAI/finbert"
    revision: "main"
    roles: ["zero_shot", "finetune_encoder"]
    embedding_dim: 768
  roberta:
    hf_id: "cardiffnlp/twitter-roberta-base-sentiment-latest"
    revision: "main"
    roles: ["zero_shot", "finetune_encoder"]
    embedding_dim: 768

horizons: [1, 3, 5, 10, 30]

# 3 expanding rolling windows covering 2017-2021
windows:
  - name: "window1"
    train_start: "2017-01-01"
    train_end: "2018-12-31"
    val_start: "2019-01-01"
    val_end: "2019-12-31"
    test_start: "2020-01-01"
    test_end: "2020-12-31"
  - name: "window2"
    train_start: "2017-01-01"
    train_end: "2019-12-31"
    val_start: "2020-01-01"
    val_end: "2020-12-31"
    test_start: "2021-01-01"
    test_end: "2021-12-31"
  - name: "window3"
    train_start: "2017-01-01"
    train_end: "2017-12-31"
    val_start: "2018-01-01"
    val_end: "2018-12-31"
    test_start: "2019-01-01"
    test_end: "2019-12-31"

hyperparameters:
  n_configs: 25
  grid:
    hidden_layers: [1, 2, 3]
    neurons: [128, 256, 512]
    activation: ["relu", "gelu", "leaky_relu"]
    dropout: [0.1, 0.2, 0.3]
    learning_rate: [0.001, 0.0005, 0.0001]
    batch_size: [32, 64]
    optimizer: ["adam", "adamw"]
  epochs: 100
  early_stopping_patience: 10

threshold_sweep:
  step: 0.001

approaches: ["separate", "single"]
